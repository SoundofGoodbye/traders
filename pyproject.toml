[project]
name = "traders"
version = "0.0.0"
description = "Agent-driven stock research & advisory system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
realdata = ["yfinance>=0.2"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]

[project.scripts]
traders = "traders.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traders"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
